# REFORMA — stack de desarrollo (§9.3 ESPECIFICACION_TECNICA)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reforma}
      POSTGRES_USER: ${POSTGRES_USER:-reforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reforma} -d ${POSTGRES_DB:-reforma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-domain:
    build: ./services/api-domain
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reforma}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reforma}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ML_SECRET: ${JWT_ML_SECRET}
      ML_BASE_URL: http://api-ml:8081
      FRONTEND_URL: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-ml:
    build: ./services/api-ml
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reforma}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-reforma}
      REDIS_URL: redis://redis:6379/1
      JWT_ML_SECRET: ${JWT_ML_SECRET}
      ALLOWED_ISSUER: api-domain
      ALLOWED_AUDIENCE: api-ml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ml_models:/app/models_store

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    environment:
      NG_APP_API_URL: http://localhost:8080
    depends_on:
      - api-domain

volumes:
  postgres_data:
  ml_models:
